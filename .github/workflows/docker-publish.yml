name: build-and-push

# 触发时机：
#   1. 推送版本 tag（如 v1.0.0）→ 自动构建并推送镜像
#   2. 在 Actions 页面手动触发 → 同样构建推送
#
# 推送目标（双推）：
#   · Docker Hub：tianjian518/tjtv
#   · GHCR      ：ghcr.io/tianjian518/tjtv
#
# 多架构：linux/amd64 + linux/arm64
#   amd64 与 arm64 各自跑在原生 runner 上并行构建（GitHub 公开仓库免费
#   提供 ubuntu-24.04-arm），按 digest 推送后合并成 manifest list。
#   不用 QEMU 跨架构模拟 —— 跑 npm ci / next build 极慢且容易崩。
#
# 依赖的 secrets（仓库 Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（Access Token，不是登录密码）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: tjtv
  DOCKERHUB_IMAGE: tianjian518/tjtv
  GHCR_IMAGE: ghcr.io/tianjian518/tjtv

jobs:
  # ---------- 1) 构建前校验：类型检查不过就不推镜像 ----------
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npx tsc --noEmit

  # ---------- 2) 分架构并行构建，按 digest 推送 ----------
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- GHCR：按 digest 推送 ---
      - name: 构建推送（GHCR / ${{ matrix.arch }}）
        id: ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=ghcr-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ghcr-${{ matrix.arch }}

      # --- Docker Hub：按 digest 推送 ---
      - name: 构建推送（Docker Hub / ${{ matrix.arch }}）
        id: dh
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=dh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dh-${{ matrix.arch }}

      - name: 记录 digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.ghcr.outputs.digest }}" > /tmp/digests/ghcr-${{ matrix.arch }}.txt
          echo "${{ steps.dh.outputs.digest }}"   > /tmp/digests/dh-${{ matrix.arch }}.txt
          cat /tmp/digests/*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/
          retention-days: 1

  # ---------- 3) 合并双架构成 manifest list ----------
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: 收到的 digest
        run: ls -la /tmp/digests/ && cat /tmp/digests/*.txt

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 解析标签
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.tag }}"
          else
            T="${{ github.ref_name }}"
          fi
          echo "value=$T" >> "$GITHUB_OUTPUT"
          echo "本次镜像标签：$T"

      - name: 合并发布（GHCR）
        run: |
          docker buildx imagetools create \
            -t "${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.value }}" \
            -t "${{ env.GHCR_IMAGE }}:latest" \
            "${{ env.GHCR_IMAGE }}@$(cat /tmp/digests/ghcr-amd64.txt)" \
            "${{ env.GHCR_IMAGE }}@$(cat /tmp/digests/ghcr-arm64.txt)"
          echo "--- GHCR 合并结果 ---"
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.value }}"

      - name: 合并发布（Docker Hub）
        run: |
          docker buildx imagetools create \
            -t "${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.value }}" \
            -t "${{ env.DOCKERHUB_IMAGE }}:latest" \
            "${{ env.DOCKERHUB_IMAGE }}@$(cat /tmp/digests/dh-amd64.txt)" \
            "${{ env.DOCKERHUB_IMAGE }}@$(cat /tmp/digests/dh-arm64.txt)"
          echo "--- Docker Hub 合并结果 ---"
          docker buildx imagetools inspect "${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.value }}"

      - name: 输出汇总
        run: |
          {
            echo "## 镜像已发布"
            echo ""
            echo "| 仓库 | 地址 |"
            echo "|---|---|"
            echo "| Docker Hub | \`${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.value }}\` |"
            echo "| GHCR | \`${{ env.GHCR_IMAGE }}:${{ steps.tag.outputs.value }}\` |"
            echo ""
            echo "支持架构：linux/amd64、linux/arm64"
            echo ""
            echo "拉取：\`docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ steps.tag.outputs.value }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
